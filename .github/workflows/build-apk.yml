name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Preparar arquivos web
        run: node scripts/prepare.js

      - name: Criar projeto Android
        run: npx cap add android

      - name: Ajustar para Android TV e controles
        run: node scripts/patch-android.js

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk aspect-player.apk

      - name: Guardar APK (aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: aspect-player-apk
          path: aspect-player.apk

      - name: Publicar APK (aba Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Aspect Player build ${{ github.run_number }}
          files: aspect-player.apk
